<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>五种语言测试答题室</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="home-page">
    <div class="page-frame">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="五种语言测试答题室首页">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>
            <strong>五种语言测试</strong>
            <small>Assessment Room</small>
          </span>
        </a>
        <nav class="topnav" aria-label="测试入口">
          <a href="work-test.html">工作版</a>
          <a href="love-test.html">爱人版</a>
        </nav>
      </header>

      <main class="home-hero">
        <section class="hero-copy" aria-labelledby="home-title">
          <p class="eyebrow">本地测试链接</p>
          <h1 id="home-title">把两份 PDF 题目变成可以直接答的测试。</h1>
          <p class="lede">选择一套测试开始答题，系统会自动计分并生成主要语言、次要语言和完整分布。</p>
          <div class="stat-line" aria-label="测试概览">
            <span>2 套量表</span>
            <span>30 题</span>
            <span>自动计分</span>
          </div>
        </section>

        <section class="test-grid" aria-label="可选测试">
          <a class="test-card work-card" href="work-test.html">
            <span class="card-copy">
              <span class="card-kicker">Workplace</span>
              <strong>感激和认可的五种语言测试题</strong>
              <span>适合团队、同事、项目协作场景，识别你在工作中最容易被鼓励的方式。</span>
              <span class="card-action">进入工作版测试</span>
            </span>
            <span class="preview-wrap">
              <img src="assets/work-preview.png" alt="工作版测试题 PDF 预览">
            </span>
          </a>

          <a class="test-card love-card" href="love-test.html">
            <span class="card-copy">
              <span class="card-kicker">Relationship</span>
              <strong>爱的五种语言测试题</strong>
              <span>适合亲密关系场景，帮助看见你更容易感受到爱的表达方式。</span>
              <span class="card-action">进入爱人版测试</span>
            </span>
            <span class="preview-wrap">
              <img src="assets/love-preview.png" alt="爱人版测试题 PDF 预览">
            </span>
          </a>
        </section>
      </main>
      <button class="creator-egg" type="button" aria-label="作者彩蛋">JH</button>
    </div>
  </body>
</html>
